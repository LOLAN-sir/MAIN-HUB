<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>LOLAN | TOP SECRET</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    min-height:100vh;
    background:#050609;
    color:#fff;
}

/* BACKGROUND */

body::before{
    content:"";
    position:fixed;
    inset:0;
    z-index:-1;

    background:
        radial-gradient(
            circle at 20% 20%,
            #12324755,
            transparent 30%
        ),
        radial-gradient(
            circle at 80% 80%,
            #4b183844,
            transparent 30%
        );
}

/* NAV */

nav{
    height:75px;

    padding:0 7%;

    display:flex;
    align-items:center;
    justify-content:space-between;

    border-bottom:1px solid #202631;

    background:rgba(5,6,9,.9);
}

.logo{
    font-size:25px;
    font-weight:900;
    letter-spacing:3px;
}

.logo span{
    color:#55d9ff;
}

.nav-text{
    color:#697382;
    font-size:12px;
    letter-spacing:3px;
}

/* MAIN */

main{
    min-height:calc(100vh - 75px);

    display:flex;
    justify-content:center;
    align-items:center;

    padding:30px 20px;
}

/* PANEL */

.panel{
    width:100%;
    max-width:650px;

    padding:50px 35px;

    text-align:center;

    background:#0c0f14;

    border:1px solid #303641;

    border-radius:22px;

    box-shadow:
        0 30px 80px #000;
}

/* CLASSIFIED */

.classified{
    display:inline-block;

    padding:8px 15px;

    margin-bottom:20px;

    border:1px solid #ff5555;

    border-radius:5px;

    color:#ff6666;

    font-size:11px;

    font-weight:bold;

    letter-spacing:4px;
}

/* LOCK */

.lock{
    font-size:55px;
    margin-bottom:15px;
}

/* TITLE */

h1{
    font-size:clamp(42px,8vw,75px);

    line-height:.95;

    letter-spacing:-3px;

    margin-bottom:15px;
}

h1 span{
    color:#ff5555;
}

/* DESCRIPTION */

.description{
    color:#8993a2;

    font-size:14px;

    line-height:1.6;

    margin-bottom:30px;
}

/* LOGIN */

.login-box{
    width:100%;
    max-width:400px;

    margin:auto;
}

/* INPUT */

.input{
    display:block;

    width:100%;

    height:50px;

    padding:0 15px;

    margin-bottom:15px;

    background:#07090d;

    color:#fff;

    border:1px solid #303641;

    border-radius:9px;

    outline:none;

    font-size:14px;
}

.input:focus{
    border-color:#55d9ff;

    box-shadow:
        0 0 15px #55d9ff22;
}

/* BUTTON */

.login-button{
    display:block;

    width:100%;

    height:50px;

    border:none;

    border-radius:9px;

    background:#fff;

    color:#07090d;

    font-size:12px;

    font-weight:bold;

    cursor:pointer;

    transition:.3s;
}

.login-button:hover{
    transform:translateY(-3px);

    box-shadow:
        0 10px 30px #000;
}

/* ERROR */

#error{
    display:none;

    margin-top:15px;

    color:#ff5555;

    font-size:12px;

    font-weight:bold;
}

/* SECRET CONTENT */

#secretContent{
    display:none;
}

.success{
    color:#55d9ff;

    font-size:12px;

    font-weight:bold;

    letter-spacing:3px;

    margin-bottom:20px;
}

.secret-title{
    font-size:45px;

    margin-bottom:15px;
}

.secret-text{
    color:#8993a2;

    line-height:1.7;
}

/* BACK */

.back{
    display:inline-block;

    margin-top:30px;

    padding:12px 20px;

    background:#fff;

    color:#07090d;

    border-radius:9px;

    text-decoration:none;

    font-size:12px;

    font-weight:bold;
}

.back:hover{
    transform:translateY(-3px);
}

/* MOBILE */

@media(max-width:600px){

    nav{
        padding:0 5%;
    }

    .nav-text{
        display:none;
    }

    .panel{
        padding:40px 22px;
    }

}

</style>

</head>


<body>


<!-- NAV -->

<nav>

    <div class="logo">
        LO<span>LAN</span>
    </div>

    <div class="nav-text">
        CLASSIFIED ACCESS
    </div>

</nav>


<!-- MAIN -->

<main>

    <div class="panel">


        <!-- LOGIN SCREEN -->

        <div id="loginScreen">

            <div class="classified">
                ⚠ TOP SECRET ⚠
            </div>

            <div class="lock">
                🔒
            </div>

            <h1>
                <span>RESTRICTED</span><br>
                ACCESS
            </h1>

            <p class="description">
                This area is classified.
                Enter your ID and password to continue.
            </p>


            <!-- ID + PASSWORD -->

            <div class="login-box">

                <input
                    id="userID"
                    class="input"
                    type="text"
                    placeholder="ENTER ID"
                    autocomplete="off"
                >

                <input
                    id="password"
                    class="input"
                    type="password"
                    placeholder="ENTER PASSWORD"
                >

                <button
                    class="login-button"
                    onclick="unlock()"
                >
                    🔓 UNLOCK SYSTEM
                </button>

                <div id="error">
                    ⚠ ACCESS DENIED
                </div>

            </div>

        </div>


        <!-- SECRET PAGE AFTER LOGIN -->

        <div id="secretContent">

            <div class="success">
                ✓ ACCESS GRANTED
            </div>

            <div class="lock">
                🔓
            </div>

            <div class="secret-title">
                WELCOME
            </div>

            <p class="secret-text">
                You successfully unlocked the
                classified LOLAN area.
            </p>

            <a
                class="back"
                href="index.html"
            >
                ← BACK TO LOLAN
            </a>

        </div>


    </div>

</main>


<script>

/* =========================
   LOGIN DETAILS
   ========================= */

const correctIDs = ["LOLAN", "ANISH", "CHRISTY", "SREENANDHAN"];
const correctPassword = "2027";


/* =========================
   UNLOCK FUNCTION
   ========================= */

function unlock(){

    const id =
        document.getElementById("userID").value;

    const password =
        document.getElementById("password").value;

    const error =
        document.getElementById("error");


    if(
    correctIDs.includes(id) &&
    password === correctPassword
){
    document.getElementById("loginScreen").style.display = "none";
    document.getElementById("secretContent").style.display = "block";
}else{
    error.style.display = "block";
}

    }

}


/* ENTER KEY */

document.addEventListener(
    "keydown",
    function(event){

        if(event.key === "Enter"){
            unlock();
        }

    }
);

</script>


</body>

</html>
